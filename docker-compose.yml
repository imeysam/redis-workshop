version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    stdin_open: true  # مهم برای CLI تعاملی
    tty: true         # مهم برای CLI تعاملی
    volumes:
      - .:/app        # برای development: تغییرات کد بلافاصله اعمال بشه
    command: python main.py

volumes:
  redis_data: